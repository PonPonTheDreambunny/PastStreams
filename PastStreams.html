<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pon Pon's streams, database</title>
	<style>
		/* CSS Variables */
		:root {
			--background: #F7F7F8;
			--row-even: #F7F7F8;
			--row-odd: #EAEAEC;
			--row-border: #BBBBBF;
			--header: #FFFFFF;
			--header-border: #DBDBDC;
			--button-hover: #DCDCD8;
			--text: #1A1A1A;
			--border: #D1D1CD;
			--selected: #E4CFF8;
			--selected-text: #1A1A1A;
			--selected-hover: #CCAAF9;
			--selected-border: #CCAAF9;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--background: #0E0E10;
				--row-even: #0E0E10;
				--row-odd: #1F1F23;
				--row-border: #505059;
				--header: #18181B;
				--header-border: #040405;
				--button-hover: #242528;
				--text: #ECECE8;
				--border: #2A2B30;
				--selected: #CCAAF9;
				--selected-text: #1A1A1A;
				--selected-hover: #E4CFF8;
				--selected-border: #E4CFF8;
			}
		}

		/* BODY */
		body {
			margin: 0;
			background-color: var(--background);
			color: var(--text);
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			transition: filter 0.15s ease;
		}
		.filter_blur {
			filter: blur(4px);
			transition: filter 0.5s ease;
		}

		/* HEADER */
		.header {
			position: sticky;
			top: 0;
			z-index: 1000;
			background-color: var(--header);
			height: 56px;
			border-bottom: 1px solid var(--header-border);
		}
		.header-settings {
			display: flex;
			justify-content: flex-end;
			gap: 32px;
			padding: 8px 16px 8px 16px;
		}
		.header-settings-group {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
		}
		.settings-button {
			background-color: var(--header);
			color: var(--text-color);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 4px 0px;
			width: 64px;
			line-height: 0.75;
			text-align: center;
			cursor: pointer;
			transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
		}
		.settings-button.settings-button-wide {
			width: 128px;
		}
		.settings-button:hover {
			background-color: var(--button-hover);
		}
		.settings-button.selected {
			color: var(--selected-text);
			background-color: var(--selected);
			border: 1px solid var(--selected-border);
		}
		.settings-button.selected:hover {
			background-color: var(--selected-hover);
		}
		.settings-button .title {
			font-size: 13px;
			font-weight: 700;
		}
		.settings-button .details {
			font-size: 9px;
			line-height: 7px;
		}
		.settings-button.dialogue-button {
			padding: 8px 0;
			width: 72px;
		}

		/* TABLE */
		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}
		tr.even {
			background-color: var(--header);
		}
		tr.odd {
			background-color: var(--header);
		}
		tr.upper td {
			padding-top: 12px;
		}
		tr.lower td, tr.upper td.tall {
			padding-bottom: 12px;
		}
		tr.lower {
			border-bottom: 1px solid var(--row-border);
		}
		tr.row-even {
			background-color: var(--row-even);
		}
		tr.row-odd {
			background-color: var(--row-odd);
		}
		th, td {
			padding: 0 12px;
			font-size: 16px;
		}
		.column-fit {
			white-space: nowrap;
			width: 1%;
		}
		.column-expand {
			width: auto;
		}
		.column-index {
			display: inline;
		}
		.column-length {
			text-align: right;
		}
		.column-video {
			display: inline;
		}
		.text-wide {
			display: block;
		}
		.text-narrow {
			display: none;
		}
		.text-squish {
			letter-spacing: -0.5px;
			font-size: 12px;
			transform: scaleY(1.2);
		}

		/* SETTINGS */
		#settings-dialogue {
			padding: 20px;
			border-radius: 8px;
			border: 1px solid #ccc;
			max-width: 400px;
			width: 100%;
		}
		.dialogue-options {
			margin-bottom: 24px;
		}
		.dialogue-option {
			margin-bottom: 12px;
		}
		.dialogue-option label {
			display: block;
			padding-bottom: 4px;
		}
		.dialogue-option select {
			width: 100%;
			padding: 8px 4px;
			border-radius: 8px;
		}
		.dialogue-buttons {
			text-align: right;
			gap: 8px;
			display: flex;
			justify-content: flex-end;
		}

		@media screen and (max-width: 1152px){
			tr.upper td {
				padding-top: 10px;
			}
			tr.lower td, tr.upper td.tall {
				padding-bottom: 10px;
			}
			.text-wide {
				display: none;
			}
			.text-narrow {
				display: block;
			}
		}
		@media screen and (max-width: 1024px){
			.column-video {
				display: none;
			}
			th, td {
				padding: 0 8px;
			}
		}
		@media screen and (max-width: 932px){
			.column-index {
				display: none;
			}
		}
		@media screen and (max-width: 886px){
			tr.upper td {
				padding-top: 6px;
			}
			tr.lower td, tr.upper td.tall {
				padding-bottom: 6px;
			}
		}
		@media screen and (max-width: 804px){
			th, td {
				letter-spacing: -0.5px;
				padding: 0 6px;
			}
			.column-length {
				display: none;
			}
		}
		@media screen and (max-width: 768px){
			th, td {
				letter-spacing: -0.75px;
			}
		}
		@media screen and (max-width: 680px){
			th, td {
				padding: 0 2px;
				letter-spacing: -0.5px;
			}
			#settings-dialogue {
				padding: 48px 32px;
        border-radius: 32px;
        border: none;
        max-width: none;
        width: calc(100vw - 112px);
			}
			#settings-formats {
				margin-bottom: 48px;
			}
			.dialogue-option {
				margin-bottom: 24px;
			}
			.dialogue-option label {
				text-align: center;
				font-weight: 600;
				padding-bottom: 8px;
			}
			.dialogue-option select {
				padding: 12px 8px;
				border-radius: 26px;
			}
			.settings-button.dialogue-button {
				padding: 12px 0;
				max-width: 192px;
        width: calc(100vw - 112px);
        border-radius: 20px;
			}
			.dialogue-buttons {
				text-align: center;
				gap: 16px;
				display: grid;
				justify-content: center;
			}
			.settings-button.dialogue-button.cancel {
				order: 1;
			}
			.settings-button.dialogue-button.confirm {
				order: -1;
			}
		}
	</style>
</head>
<body>
	<div class="header">
		<div class="header-settings">
			<div class="header-settings-group">
			<button class="settings-button settings-button-wide" id="formats" onclick="openFormatsModal()"><span class="title">Formats</span><br><span id="formats-details" class="details">YYYY-MM-DD • 24+ h<br>Titles: Europe</span></button>
			</div>
			<div class="header-settings-group">
			<button class="settings-button" id="zone0" onclick="setZoneFormat('UTC')"><span class="title">Global</span><br><span class="details">UTC<br>GMT</span></button>
			<button class="settings-button" id="zone1" onclick="setZoneFormat('EU')"><span class="title">Pon Pon</span><br><span class="details">CET<br>CEST</span></button>
			<button class="settings-button selected" id="zone2" onclick="setZoneFormat('device')"><span class="title">Yours</span><br><span class="details" id="userTimezoneAbbreviations">XXX<br>XXX</span></button>
			<button class="settings-button" id="zone3" onclick="openTimezoneModal()"><span class="title">Other</span><br><span class="details" id="otherTimezoneAbbreviations">pick a<br>timezone</span></button>
			</div>
		</div>
	</div>
	
	<table>
		<tbody id="tableBody">
		</tbody>
	</table>
	
	<!-- Modal Popup Layout -->
	<dialog id="settings-dialogue">
		<form id="modalForm">
			<!-- View A: Formats Form Controls -->
			<div id="settings-formats" class="dialogue-options">
				<div class="dialogue-option">
					<label for="options-date">Date-format</label>
					<select id="options-date"></select>
				</div>
				<div class="dialogue-option">
					<label for="options-time">Time-format</label>
					<select id="options-time"></select>
				</div>
				<div class="dialogue-option">
					<label for="options-region">Game-region</label>
					<select id="options-region"></select>
				</div>
				<div class="dialogue-option">
					<label for="options-groups">Multigame-streams</label>
					<select id="options-groups"></select>
				</div>
			</div>

			<!-- View B: Timezone Form Controls (Region + Zone) -->
			<div id="settings-timezone" class="dialogue-options">
				<div class="dialogue-option">
					<label for="options-timeregion">Region</label>
					<select id="options-timeregion" onchange="populateTimezonesByRegion()"></select>
				</div>
				<div class="dialogue-option">
					<label for="options-timezone">Timezone</label>
					<select id="options-timezone"></select>
				</div>
			</div>

			<!-- Form Actions -->
			<div class="dialogue-buttons">
				<button type="button" class="settings-button dialogue-button cancel" onclick="closeSettingsModal(false)">Cancel</button>
				<button type="button" class="settings-button dialogue-button confirm selected" onclick="closeSettingsModal(true)">Save</button>
			</div>
		</form>
	</dialog>

	<script src="database.js"></script>
	<script src="locale.js"></script>
	<script src="timezone.js"></script>
	<script>
		// Date: ymd-: y-MM-dd, ymd/: y/MM/dd, ymd.: y.MM.dd, dmy/: dd/MM/y, dmy.: dd.MM.y, dmy-: dd-MM-y, mdy/: M/d/y, dmmy: d MMM y, mmdy: MMM d, y
		// Time: 24h: 00:00-23:59, 30h: 00:00-29:59, 12h: 12:00-11:59 pm, 12hJP: 0:00-11:59 pm, 12hCN: 12:00-11:59 LC/ZS/SW/ZW/XW/WS
		// Timezone: UTC: UTC, EU: Europe/Stockholm, device: Device, other: Other
		// Region: EU, US, AU, JP
		// ZoneRegion: tzAU, tzCA, tzEU, tzLA, tzUS
		// Groupings: all: ignore different games, streams: (default) linebreak games with different times, games: duplicate every line for every game, none: treat each game as a separate stream
		const formatSetting = ["ymd-", "24h", "device", "EU", "tzAU", "streams"];
		
		// Detect locale from device
		const deviceLanguage = getDeviceLanguage();
		const deviceRegion = getDeviceRegion();
		const deviceTimezone = getDeviceTimezone();
		var otherTimezone = "Australia/Sydney";
		setStartingValues();
		
		function openFormatsModal() {
			document.body.classList.add("filter_blur");
			currentModalContext = "formats";
			document.getElementById("settings-formats").style.display = "block";
			document.getElementById("settings-timezone").style.display = "none";
			const dateKeys = ["ymd-", "ymd/", "ymd.", "dmy/", "dmy.", "dmy-", "mdy/", "dmmy", "mmdy"];
			const dateNames = ["2026-12-31", "2026/12/31", "2026.12.31", "31/12/2026", "31.12.2026", "31-12-2026", "12/31/2026", "31 Dec 2026", "Dec 31, 2026"];
			const timeKeys = ["24h", "30h", "12h", "12hJP", "12hCN"];
			const timeNames = ["00:00–24:00", "00:00–30:00", "12:00 am – 11:59 pm", "0:00 am – 11:59 pm", "0:00 dwn – 11:59 evn"];
			const regionKeys = ["US", "EU", "AU", "JP"];
			const regionNames = ["America", "Europe, Africa", "Australia, Oceania", "Japan"];
			const groupKeys = ["all", "streams", "games", "none"];
			const groupNames = ["Don't display multiple games per stream", "Display separate times for games within a stream", "Display all info separate per games within a stream", "Split separate games into separate streams"];

			buildSelectOptions("options-date", dateKeys, formatSetting[0], dateNames);
			buildSelectOptions("options-time", timeKeys, formatSetting[1], timeNames);
			buildSelectOptions("options-region", regionKeys, formatSetting[3], regionNames);
			buildSelectOptions("options-groups", groupKeys, formatSetting[5], groupNames);

			document.getElementById("settings-dialogue").showModal();
		}
		function openTimezoneModal() {
			document.body.classList.add("filter_blur");
			currentModalContext = "timezone";
			document.getElementById("settings-formats").style.display = "none";
			document.getElementById("settings-timezone").style.display = "block";

			const regionSelect = document.getElementById("options-timeregion");
			regionSelect.innerHTML = ``;
			
			const regionKeys = ["tzAU", "tzCA", "tzEU", "tzLA", "tzUS"]
			const regionNames = ["Australia", "Canada", "Europe", "South America", "United States"];
			
			buildSelectOptions("options-timeregion", regionKeys, formatSetting[4], regionNames);
			populateTimezonesByRegion();
			document.getElementById("settings-dialogue").showModal();
		}
		function populateTimezonesByRegion() {
			let zoneKeys = ["Etc/UTC"];
			let zoneNames = ["UTC"];
			switch (document.getElementById("options-timeregion").value) {
				case "tzAU":
					zoneKeys = ["Indian/Cocos","Indian/Christmas","Australia/Perth","Australia/Eucla","Australia/Darwin","Australia/Adelaide","Australia/Brisbane","Australia/Sydney","Australia/Lord_Howe","Pacific/Norfolk"];
					zoneNames = ["Cocos","Christmas","Western","Central Western","Northern Territory","South Australia","Queensland","NSW, TAS, VIC, ACT, JBT","Lore Howe","Norfolk"];
					break;
				case "tzCA":
					zoneKeys = ["America/Vancouver","America/Edmonton","America/Regina","America/Winnipeg","America/Toronto","America/Blanc-Sablon","America/Halifax","America/St_Johns"];
					zoneNames = ["British Columbia","Alberta / NW Territories","Saskatchewan","Manitoba","Toronto / Ottawa / Québec","Kegasaka / Blanc Sablon","New Brunswick / Nova Scotia","Newfoundland"];
					break;
				case "tzEU":
					zoneKeys = ["Iceland","Europe/Dublin","Europe/London","Europe/Lisbon","Europe/Berlin","Europe/Athens"];
					zoneNames = ["Iceland","Ireland","United Kingdom","Western","Central","Eastern"];
					break;
				case "tzLA":
					zoneKeys = ["America/Argentina/Cordoba","America/Rio_Branco","America/Manaus","America/Sao_Paulo","America/Noronha","America/Santiago","America/Punta_Arenas","America/Bogota","America/Guayaquil","Atlantic/Stanley","America/Cayenne","America/Guyana","America/Asuncion","America/Lima","America/Paramaribo","America/Montevideo","America/Caracas"];
					zoneNames = ["Argentina","Brazil (west) - Acre","Brazil (central) - Amazon","Brazil (east) - Brasília","Brazil (Atlantic) - Noronha","Chile (north) - seasonal summertime","Chile (south) - permanent summertime","Colombia","Ecuador","Falkland Islands","French Guyana","Guyana","Paraguay","Peru","Suriname","Uruguay","Venezuela"];
					break;
				case "tzUS":
					zoneKeys = ["Pacific/Honolulu","America/Anchorage","America/Los_Angeles","America/Phoenix","America/Denver","America/Chicago","America/New_York","America/Puerto_Rico"];
					zoneNames = ["Hawaii","Alaska","Pacific","Arizona","Mountain","Central","Eastern","Puerto Rico"];
					break;
			}
			buildSelectOptions("options-timezone", zoneKeys, otherTimezone, zoneNames);
		}
		function buildSelectOptions(selectId, keysArray, activeValue, labelArray) {
			const selectNode = document.getElementById(selectId);
			selectNode.innerHTML = ``;
			keysArray.forEach((key, index) => {
				const opt = document.createElement("option");
				opt.value = key;
				opt.innerText = labelArray[index];
				if (key === activeValue) opt.selected = true;
				selectNode.appendChild(opt);
			});
		}
		function closeSettingsModal(save) {
			const modal = document.getElementById("settings-dialogue");
			document.body.classList.remove("filter_blur");
			
			if (save) {
				if (currentModalContext === "formats") {
					formatSetting[0] = document.getElementById("options-date").value;
					formatSetting[1] = document.getElementById("options-time").value;
					formatSetting[3] = document.getElementById("options-region").value;
					formatSetting[5] = document.getElementById("options-groups").value;
				} else if (currentModalContext === "timezone") {
					formatSetting[4] = document.getElementById("options-timeregion").value;
					otherTimezone = document.getElementById("options-timezone").value;
					formatSetting[2] = "other";
				}
				updateButtonSelected();
				renderTable();
			}
			
			modal.close();
		}
		function setStartingValues() {
			const formatDate = getRegionDateFormat(deviceLanguage, deviceRegion);
			formatSetting[0] = formatDate;
			const formatTime = getRegionTimeFormat(deviceLanguage, deviceRegion);
			formatSetting[1] = formatTime;
			const formatMarket = getRegionMarket(deviceLanguage, deviceRegion);
			formatSetting[3] = formatMarket;

			updateButtonSelected();
			
			const userTimezoneAbbreviations = document.getElementById("userTimezoneAbbreviations");
			const abbr = getTimezoneNormalSummerAbbreviation(deviceTimezone);
			userTimezoneAbbreviations.innerHTML = `${abbr[0]}${abbr[1] ? "<br>"+abbr[1] : ""}`
		}
		function getFormatSettingName(type, value) {
			switch (type) {
				case 0:
				switch (value) {
					case "ymd-":
						return "YYYY-MM-DD";
					case "ymd/":
						return "YYYY/MM/DD";
					case "ymd.":
						return "YYYY.MM.DD";
					case "dmy/":
						return "DD/MM/YYYY";
					case "dmy.":
						return "DD.MM.YYYY";
					case "dmy-":
						return "DD-MM-YYYY";
					case "mdy/":
						return "M/D/YYYY";
					case "dmmy":
						return "D MMM YYYY";
					case "mmdy":
						return "MMM D, YYYY";
					default:
						return "------";
				}
				case 1:
				switch (value) {
					case "24h":
						return "24 h";
					case "30h":
						return "24+ h";
					case "12h":
						return "12 h";
					case "12hJP":
						return "0-11 h";
					case "12hCN":
						return "12 h LC";
					default:
						return "----";
				}
				case 3:
				switch (value) {
					case "EU":
						return "Europe";
					case "US":
						return "America";
					case "AU":
						return "Australia";
					case "JP":
						return "Japan";
					default:
						return "-----";
				}
				default:
					return "---";
			}
		}
		
		function renderTable() {
			let tableBody = document.getElementById("tableBody");
			if (!tableBody) return;
			tableBody.innerHTML = ``;
			tableBody = getTableFromDatabase(databaseVODs, formatSetting[5]);
		}
		
		function setDateFormat(idx) {
			updateButtonSelected();
			renderTable();
		}
		function setZoneFormat(format) {
			formatSetting[2] = format;
			updateButtonSelected();
			renderTable();
		}
		function updateButtonSelected() {
			const formats = document.getElementById("formats-details");
			const zones = [document.getElementById("zone0"),document.getElementById("zone1"),document.getElementById("zone2"),document.getElementById("zone3")];

			formats.innerHTML = `${getFormatSettingName(0, formatSetting[0])} • ${getFormatSettingName(1, formatSetting[1])}<br>Titles: ${getFormatSettingName(3, formatSetting[3])}`;

			if (formatSetting[2] === "UTC") {zones[0].classList.add('selected');} else {zones[0].classList.remove('selected');}
			if (formatSetting[2] === "EU") {zones[1].classList.add('selected');} else {zones[1].classList.remove('selected');}
			if (formatSetting[2] === "device") {zones[2].classList.add('selected');} else {zones[2].classList.remove('selected');}
			if (formatSetting[2] === "other") {
				zones[3].classList.add('selected');
				const otherTimezoneAbbreviations = document.getElementById("otherTimezoneAbbreviations");
				const abbr = getTimezoneNormalSummerAbbreviation(otherTimezone);
				otherTimezoneAbbreviations.innerHTML = `${abbr[0]}${abbr[1] ? "<br>"+abbr[1] : ""}`;
			} else {
				zones[3].classList.remove('selected');
				const otherTimezoneAbbreviations = document.getElementById("otherTimezoneAbbreviations");
				otherTimezoneAbbreviations.innerHTML = `pick a<br>timezone`;
			}
		}
		function getActiveTimezone() {
			switch (formatSetting[2]) {
				case "device":
					return deviceTimezone;
				case "EU":
					return "Europe/Stockholm";
				case "UTC":
					return "UTC";
				case "other":
					return otherTimezone;
			}
		}
		
		renderTable();
	</script>
</body>
</html>

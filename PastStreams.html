<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pon Pon's streams, database</title>
	<style>
		/* CSS Variables */
		:root {
			--background: #FFFFFF;
			--header: #ECECE8;
			--button-hover: #DCDCD8;
			--color: #1A1A1A;
			--border: #D1D1CD;
			--selected: #E4CFF8;
			--selected-hover: #CCAAF9;
			--selected-border: #CCAAF9;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--background: #0C0D0F;
				--header: #141518;
				--button-hover: #242528;
				--color: #ECECE8;
				--border: #2A2B30;
				--selected: #CCAAF9;
				--selected-hover: #E4CFF8;
				--selected-border: #E4CFF8;
			}
		}
		

		/* BODY */
		body {
			margin: 0;
			background-color: var(--background);
			color: var(--color);
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}

		/* HEADER */
		.header {
			position: sticky;
			top: 0;
			z-index: 1000;
			background-color: var(--header);
		}
		.header-settings {
			display: flex;
			justify-content: flex-end;
			gap: 32px;
			padding: 8px 16px 0 16px;
		}
		.header-settings-group {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
		}
		.settings-button {
			background-color: var(--header);
			color: var(--text-color);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 4px 0px;
			width: 64px;
			line-height: 0.75;
			text-align: center;
			cursor: pointer;
			transition: background-color 0.15s ease;
		}
		.settings-button:hover {
			background-color: var(--button-hover);
		}
		.settings-button.selected {
			background-color: var(--selected);
			border: 1px solid var(--selected-border);
		}
		.settings-button.selected:hover {
			background-color: var(--selected-hover);
		}
		.settings-button .title {
			font-size: 12.5px;
			font-weight: bold;
		}
		.settings-button .details {
			font-size: 10px;
		}

		/* TABLE */
		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}
		th {
			background-color: var(--header);
			padding: 8px 8px;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.5px;
		}
		td {
			padding: 8px 8px;
			border-bottom: 1px solid var(--border);
			font-size: 14px;
		}
		#tableBody tr th {
			padding: 0 8px;
		}
		.column-index {
			width: 40px;
		}
		.column-datetime {
			width: 180px;
		}
		.column-duration {
			width: 80px;
		}
		.column-resolution {
			width: 80px;
		}
		
		@media screen and (max-width: 1152px){
			td {
				letter-spacing: -0.5px;
			}
			th {
				letter-spacing: -0.5px;
			}
			.column-index {
				width: 35px;
			}
			.column-datetime {
				width: 160px;
			}
			.column-duration {
				width: 65px;
			}
			.column-resolution {
				width: 40px;
			}
		}
		@media screen and (max-width: 840px){
			.header-settings {
				gap: 16px;
				padding: 8px 8px 0 8px;
			}
			.header-settings-group {
				gap: 4px;
			}
			td {
				font-size: 11px;
				letter-spacing: -0.75px;
			}
			th {
				font-size: 11px;
			}
			.column-index {
				width: 25px;
			}
			.column-datetime {
				width: 115px;
			}
			.column-duration {
				width: 50px;
			}
			.column-resolution {
				width: 30px;
			}
		}
		@media screen and (max-width: 768px){
			.settings-button {
				width: 56px;
				letter-spacing: -0.5px;
			}
			.settings-button .title {
				font-size: 12px;
				font-weight: bold;
			}
			.settings-button .details {
				font-size: 9px;
			}
		}
		@media screen and (max-width: 680px){
			.header-settings {
				gap: 8px;
				padding: 8px 4px 0 4px;
			}
			.header-settings-group {
				gap: 2px;
			}
			.settings-button {
				width: 48px;
				letter-spacing: -0.5px;
			}
			.settings-button .title {
				font-size: 11px;
				font-weight: bold;
			}
			.settings-button .details {
				font-size: 8px;
			}
			td {
				font-size: 10px;
				letter-spacing: -1px;
			}
			th {
				font-size: 10px;
			}
			.column-datetime {
				width: 100px;
			}
		}
		@media screen and (max-width: 560px){
			.header-settings {
				display: grid;
				justify-content: flex-end;
				gap: 4px;
				padding: 4px 4px 0 4px;
			}
			.header-settings-group {
				gap: 8px;
			}
			.settings-button {
				width: 64px;
				letter-spacing: 0;
				padding: 2px 0px;
			}
			.settings-button .title {
				font-size: 11px;
				font-weight: bold;
			}
			.settings-button .details {
				font-size: 9px;
			}
			td {
				font-size: 9px;
				letter-spacing: -1px;
			}
			th {
				font-size: 9px;
			}
			.column-index {
				width: 20px;
			}
			.column-datetime {
				width: 90px;
			}
		}
	</style>
</head>

					break;
				case "US":
					currentFormat[0] = 2;
					currentFormat[1] = 1;
					break;
				case "VE":
					currentFormat[1] = 1;
					break;
			}
			updateButtonSelected();
			
			const userTimezoneAbbreviations = document.getElementById("userTimezoneAbbreviations");
			const abbr = getUserTimezoneNormalAndSummer()
			
			userTimezoneAbbreviations.innerHTML = `${abbr[0]}${abbr[1] ? "<br>"+abbr[1] : ""}`
		}
		
		function renderTable() {
			const tableBody = document.getElementById("tableBody");
			if (!tableBody) return;
			tableBody.innerHTML = `
			<tr>
				<th class="column-index"></th>
				<th class="column-datetime"></th>
				<th class="column-datetime"></th>
				<th class="column-duration"></th>
				<th></th>
				<th class="column-resolution"></th>
			</tr>`;
			
			index = 0;
			scheduleDatabase.forEach(item => {
				const formattedStart = formatDateTime(item.start, currentFormat[0], currentFormat[1], currentFormat[2]);
				const formattedEnd = formatDateTime(item.end, currentFormat[0], currentFormat[1], currentFormat[2]);

				const categoriesFormatted = item.category.map(cat => {
					const catStart = formatCategoryTime(cat.start, currentFormat[1], item.start, currentFormat[2]);
					const catEnd = formatCategoryTime(cat.end, currentFormat[1], item.end, currentFormat[2]);
					const catTime = currentFormat[1] === 0 ? `${catStart}–${catEnd}` : `${catStart} – ${catEnd}`.replace(/am (– [0-9:]+ am)/, "$1").replace(/pm (– [0-9:]+ pm)/, "$1").replace(/am – 0:([0-9]+ )pm/, "– 12:$1am");
					return `[${catTime}] ${cat.id}`;
				}).join(`<br>`);

				const row = document.createElement("tr");
				row.innerHTML = `
					<td>${++index}</td>
					<td>${formattedStart}</td>
					<td>${formattedEnd}</td>
					<td>${formatDuration(item.duration)}</td>
					<td>${categoriesFormatted}</td>
					<td>${item.lines}p</td>
				`;
				tableBody.appendChild(row);
			});
		}
		
		function setDateFormat(idx) {
			currentFormat[0] = idx;
			updateButtonSelected();
			renderTable();
		}
		function setTimeFormat(idx) {
			currentFormat[1] = idx;
			updateButtonSelected();
			renderTable();
		}
		function setZoneFormat(idx) {
			currentFormat[2] = idx;
			updateButtonSelected();
			renderTable();
		}
		function updateButtonSelected() {
			const dates = [document.getElementById("date0"),document.getElementById("date1"),document.getElementById("date2"),document.getElementById("date3")];
			const times = [document.getElementById("time0"),document.getElementById("time1"),document.getElementById("time2")];
			const zones = [document.getElementById("zone0"),document.getElementById("zone1"),document.getElementById("zone2")];
			
			for (let i = 0; i < dates.length; i++) {
				if (dates[i]) {
					if (i === currentFormat[0]) {
						dates[i].classList.add('selected');
					} else {
						dates[i].classList.remove('selected');
					}
				}
			}
			for (let i = 0; i < times.length; i++) {
				if (times[i]) {
					if (i === currentFormat[1]) {
						times[i].classList.add('selected');
					} else {
						times[i].classList.remove('selected');
					}
				}
			}
			for (let i = 0; i < zones.length; i++) {
				if (zones[i]) {
					if (i === currentFormat[2]) {
						zones[i].classList.add('selected');
					} else {
						zones[i].classList.remove('selected');
					}
				}
			}
		}
		function getRegion() {
			try {
				const localeObj = new Intl.Locale(window.navigator.language).maximize();
				return localeObj.region;
			} catch (e) {
				return "GB";
			}
		}
		function getTimezoneString(tzIndex) {
			if (tzIndex === 0) return "UTC";
			if (tzIndex === 1) return "Europe/Stockholm";
			return systemTimezone;
		}
		function getTimezoneAbbreviation(tzIndex, date) {
			if (tzIndex === 0) return "UTC";
			if (tzIndex === 1) {
				const isSummer = isSummertimeCET(date, "Europe/Stockholm");
				return isSummer ? "CEST" : "CET";
			}
			return getUserTimezoneAbbreviation(date);
		}

		function isSummertimeCET(date) {
			const year = date.getUTCFullYear();
			
			function getLastSundayOfUTCMonth(year, monthIndex) {
        const lastDay = new Date(Date.UTC(year, monthIndex + 1, 0, 1, 0, 0));
        const dayOfWeek = lastDay.getUTCDay();
        lastDay.setUTCDate(lastDay.getUTCDate() - dayOfWeek);
        return lastDay;
			}
			const summerStart = getLastSundayOfUTCMonth(year, 2);
			const summerEnd = getLastSundayOfUTCMonth(year, 9);
			
			return date >= summerStart && date < summerEnd;
		}
		function formatDateTime(dateInput, dateIdx, timeIdx, tzIdx) {
			const date = new Date(dateInput);
			const timeZone = getTimezoneString(tzIdx);

			const [timeLocale, timeOptions] = {
				0: ['en-SE',{ hour: '2-digit', minute: '2-digit', hour12: false }],
				1: ['eb-GB',{ hour: 'numeric', minute: '2-digit', hour12: true }],
				2: ['en-JP',{ hour: 'numeric', minute: '2-digit', hourCycle: 'h11', hour12: true }]
			}[timeIdx];

			const [dateLocale, dateOptions] = {
				0: ['en-SE',{ year: 'numeric', month: '2-digit', day: '2-digit' }],
				1: ['en-GB',{ day: '2-digit', month: '2-digit', year: 'numeric' }],
				2: ['en-US',{ month: 'numeric', day: 'numeric', year: 'numeric' }],
				3: ['en-GB',{ day: 'numeric', month: 'short', year: 'numeric' }]
			}[dateIdx];

			const timeStr = new Intl.DateTimeFormat(timeLocale, { ...timeOptions, timeZone }).format(date).toLowerCase();
			const dateStr = new Intl.DateTimeFormat(dateLocale, { ...dateOptions, timeZone }).format(date);
			const tzAbbr = getTimezoneAbbreviation(tzIdx, date);

			return `${dateStr} ${timeStr} ${tzAbbr}`;
		}
		function formatCategoryTime(timeString, timeIdx, dateContext, tzIdx) {
			const [hours, minutes] = timeString.split(":");
			const dateObj = new Date(dateContext);
			dateObj.setUTCHours(parseInt(hours, 10), parseInt(minutes, 10));

			const timeZone = getTimezoneString(tzIdx);
			const [timeLocale, timeOptions] = {
				0: ['en-SE',{ hour: '2-digit', minute: '2-digit', hour12: false }],
				1: ['en-GB',{ hour: 'numeric', minute: '2-digit', hour12: true }],
				2: ['en-JP',{ hour: 'numeric', minute: '2-digit', hourCycle: 'h11', hour12: true }],
			}[timeIdx];

			return new Intl.DateTimeFormat(timeLocale, { ...timeOptions, timeZone }).format(dateObj).toLowerCase();
		}
		
		function formatDuration(minutes) {
			const h = Math.floor(minutes / 60);
			const m = minutes % 60;
			return `${h}h ${m}min`;
		}
		
		
		
		function getUserTimezoneName(date) {
			const longName = new Intl.DateTimeFormat('en-US', {
				systemTimezone, timeZoneName: 'long'
			}).formatToParts(date).find(p => p.type === 'timeZoneName')?.value;
			return longName;
		}
		function getUserTimezoneAbbreviation(date) {

			const abbrOverrides = [

				{ prefix: /^Irkutsk Standard Time$/, abbr: "IRKT" },
				{ prefix: /^Taiwan Standard Time$/, abbr: "NST" },
				{ prefix: /^Ulaanbaatar Standard Time$/, abbr: "ULAT" },
				{ prefix: /^Yakutsk Standard Time$/, abbr: "YAKT" },
				{ prefix: /^Papua New Guinea Time$/, abbr: "PGT" },
				{ prefix: /^Vladivostok Standard Time$/, abbr: "VLAT" },
				{ prefix: /^Magadan Standard Time$/, abbr: "MAGT" },

				{ prefix: /^Niue Time$/, abbr: "NUT" },
				{ prefix: /^American Samoa Standard Time$/, abbr: "SST" },
				{ prefix: /^Wake Island Time$/, abbr: "WAKT" }
			];
			const match = abbrOverrides.find(g => g.prefix.test(name));
			if (match) {
				if (match.abbr === "case GMT") {
					return `UTC${name.replace(/^GMT(-|\+)0?/, "$1").replace(/:00$/, "")}`;
				} else {
					return match.abbr;
				}
			}
			
			return name.replace(/[^A-Z]+/g, "");
		}
		function getUserTimezoneNormalAndSummer() {
			const year = new Date().getFullYear();
			const jan = new Date(year, 0, 15);
			const jul = new Date(year, 6, 15);
			const offsetNormal = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
			
			if (jan.getTimezoneOffset() == jul.getTimezoneOffset()) {
				return [getUserTimezoneAbbreviation(jan), ""];
			} else if (jan.getTimezoneOffset() > jul.getTimezoneOffset()) {
				return [getUserTimezoneAbbreviation(jan), getUserTimezoneAbbreviation(jul)];
			} else {
				return [getUserTimezoneAbbreviation(jul), getUserTimezoneAbbreviation(jan)];
			}
		}
